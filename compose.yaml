services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quote
      POSTGRES_PASSWORD: quote
      POSTGRES_DB: quote_assistant
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote -d quote_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - quote_pg:/var/lib/postgresql/data

volumes:
  quote_pg:
